services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao_dev_password}
      POSTGRES_DB: gestao
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gestao:${POSTGRES_PASSWORD:-gestao_dev_password}@db:5432/gestao
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-troque-esta-chave-em-producao}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:

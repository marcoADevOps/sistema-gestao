{% extends "base.html" %}
{% block title %}Entrar — Sistema de Gestão{% endblock %}
{% block content %}

<section class="panel" style="max-width: 400px; margin: 5rem auto 0;">
    <h2>Entrar</h2>
    <p class="footnote" style="margin: -0.6rem 0 1.3rem;">Acesse com seu usuário cadastrado.</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
        <label>Usuário
            <input type="text" name="username" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="password" required>
        </label>
        <button type="submit" style="width: 100%;">Entrar</button>
    </form>
</section>

{% endblock %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestão{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cor */
            --bg: #F1F3F5;
            --surface: #FFFFFF;
            --ink: #17222C;
            --ink-muted: #5B6773;
            --border: #DCE1E6;
            --primary: #1F3B4D;
            --primary-hover: #2A4E64;
            --accent: #B4762D;
            --accent-soft: #F6ECDC;
            --success: #2F7D5A;
            --success-soft: #E4F3EC;
            --danger: #B23A3A;
            --danger-soft: #FBEAEA;

            /* Tipografia */
            --font-display: "Fraunces", Georgia, serif;
            --font-ui: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--primary); }
        a:hover { color: var(--primary-hover); }

        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ---------- Header ---------- */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1.1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 0.7rem; }
        .brand-mark {
            width: 34px; height: 34px;
            background: var(--primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
            flex-shrink: 0;
        }
        header h1 {
            margin: 0;
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 1.2rem;
            color: var(--ink);
        }
        .header-user { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--ink-muted); }
        .header-user form button {
            background: transparent; color: var(--ink-muted);
            border: 1px solid var(--border); padding: 0.4rem 0.9rem;
            font-size: 0.8rem; border-radius: 6px;
        }
        .header-user form button:hover { background: var(--bg); color: var(--ink); }

        main { max-width: 1040px; margin: 2.5rem auto; padding: 0 1.5rem; }

        /* ---------- Seções ---------- */
        section { margin-bottom: 2.75rem; }
        section > h2 {
            font-family: var(--font-ui);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        /* ---------- KPI tiles ---------- */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 10px;
            padding: 1.3rem 1.4rem;
        }
        .card .value {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.1;
        }
        .card h3 {
            margin: 0.4rem 0 0;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--ink-muted);
        }

        /* ---------- Alertas ---------- */
        .alert {
            background: var(--accent-soft);
            border: 1px solid #E3CBA0;
            color: #6B4A1A;
            padding: 0.85rem 1.1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }
        .alert-error { background: var(--danger-soft); border-color: #E3B3B3; color: #7A2626; }

        .badge {
            display: inline-block;
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* ---------- Painéis (formulários) ---------- */
        .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem 1.6rem;
        }
        .panel h2 {
            margin: 0 0 1.2rem;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
        }

        form label {
            display: block;
            margin-bottom: 1rem;
            font-size: 0.82rem;
            color: var(--ink-muted);
            font-weight: 600;
        }
        form input, form select {
            display: block; width: 100%; margin-top: 0.35rem;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem; font-weight: 400;
            font-family: var(--font-ui);
            color: var(--ink);
            background: var(--surface);
        }
        form input:focus, form select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(31, 59, 77, 0.12);
        }

        .btn, form button {
            background: var(--primary); color: white; border: none;
            padding: 0.6rem 1.25rem; border-radius: 6px; cursor: pointer;
            font-size: 0.88rem; font-weight: 600; font-family: var(--font-ui);
        }
        .btn:hover, form button:hover { background: var(--primary-hover); }

        .btn-danger {
            background: transparent !important; color: var(--danger) !important;
            padding: 0.25rem 0.5rem !important; font-size: 0.82rem !important;
            font-weight: 500 !important; border: none;
        }
        .btn-danger:hover { background: var(--danger-soft) !important; }

        .link-edit { font-size: 0.85rem; font-weight: 600; }

        /* ---------- Tabelas ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td { text-align: left; padding: 0.7rem 1.1rem; font-size: 0.9rem; }
        th {
            background: var(--bg);
            font-size: 0.78rem; font-weight: 700; color: var(--ink-muted);
            border-bottom: 1px solid var(--border);
        }
        tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: #FAFBFC; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        th.num { text-align: right; }

        .empty-row td { color: var(--ink-muted); text-align: center; padding: 1.5rem; font-size: 0.88rem; }

        .footnote { color: var(--ink-muted); font-size: 0.82rem; margin-top: 2rem; }
        .breadcrumb { font-size: 0.85rem; margin-bottom: 1.5rem; }
        .breadcrumb a { color: var(--ink-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-mark">SG</div>
            <h1>Sistema de Gestão</h1>
        </div>
        {% if user %}
        <div class="header-user">
            {% if user.role == "admin" %}
            <a href="/web/users" style="color: var(--ink-muted); text-decoration: none; font-weight: 600;">Usuários</a>
            {% endif %}
            <span>{{ user.username }} <span class="footnote" style="margin:0;">({{ "admin" if user.role == "admin" else "operador" }})</span></span>
            <form method="post" action="/logout">
                <button type="submit">Sair</button>
            </form>
        </div>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
